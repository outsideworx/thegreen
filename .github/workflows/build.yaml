name: Build
on:
  push:
    branches: [main]
jobs:
  dispatch:
    runs-on: outsideworx
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'outsideworx',
              repo: 'outsideworx',
              event_type: 'update-submodule',
              client_payload: { name: 'thegreen' }
            })
